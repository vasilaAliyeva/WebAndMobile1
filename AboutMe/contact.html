    <section>
        <form action="mailto:valiyeva16144@ada.edu.az" method="post" enctype="text/plain">
            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label>Are you a:</label><br>
            <input type="radio" id="student" name="role" value="Student"> Student<br>
            <input type="radio" id="recruiter" name="role" value="Recruiter"> Recruiter<br><br>

            <label>What are you interested in?</label><br>
            <input type="checkbox" name="interest" value="Collaboration"> Collaboration<br>
            <input type="checkbox" name="interest" value="Internship"> Internship<br>
            <input type="checkbox" name="interest" value="Tutoring"> Tutoring<br><br>

            <label for="topic">Topic:</label><br>
            <select id="topic" name="topic">
                <option value="general">General Inquiry</option>
                <option value="projects">Projects</option>
                <option value="career">Career Opportunity</option>
            </select><br><br>

            <label for="message">Your Message:</label><br>
            <textarea id="message" name="message" rows="5" cols="40"></textarea><br><br>

            <input type="submit" value="Send">
            <input type="reset" value="Reset">
        </form>
    </section>
